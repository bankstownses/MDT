  if (isNaN(d.getTime())) return "—";

function getStatusFor(id, state) {
  let pendingCount = 0,
    activeCount = 0;
  VEHICLES.forEach(v => {
    const vs = state.vehicleStates[v];
    if (!vs) return;
    if (vs.incomingQueue.some(i => i.id === id)) pendingCount++;
    if (vs.queue.some(j => j.id === id)) activeCount++;
  });
  if (activeCount > 0 || pendingCount > 0) {
    const parts = [];
    if (activeCount) parts.push(`${activeCount} Active`);
    if (pendingCount) parts.push(`${pendingCount} Pending`);
    return {
      label: parts.join(", "),
      color: activeCount ? "#2F8FD1" : "#E8B23C"
    };
  }
  if (state.unassignedIncidents.some(i => i.id === id)) return {
    label: "Unassigned",
    color: "#8A6FD1"
  };
  const hasHistory = state.completedJobs.some(c => c.job.id === id) || state.calledOffJobs.some(c => c.job.id === id);
  if (hasHistory) return {
    label: "Active — No Team Tasked",
    color: "#7C8791"
  };
  return {
    label: "Unknown",
    color: "#7C8791"
  };
}
function getIncidentAssignments(id, state) {
  const active = [];
  VEHICLES.forEach(v => {
    const vs = state.vehicleStates[v];
    if (!vs) return;
    const pending = vs.incomingQueue.find(i => i.id === id);
    if (pending) {
      active.push({
        vehicle: v,
        state: "Pending Acknowledgement"
      });
      return;
    }
    const activeJob = vs.queue.find(i => i.id === id);
    if (activeJob) {
      const rec = vs.progress[id];
      active.push({
        vehicle: v,
        state: "Active",
        phase: rec ? rec.phase : null
      });
    }
  });
  const complete = state.completedJobs.filter(c => c.job.id === id).map(c => ({
    vehicle: c.vehicle,
    state: "Complete",
    formData: c.formData,
    onBoard: c.onBoard
  }));
  const calledOff = state.calledOffJobs.filter(c => c.job.id === id).map(c => ({
    vehicle: c.vehicle,
    state: "Called Off",
    reason: c.reason,
    onBoard: c.onBoard
  }));
  return {
    active,
    historical: [...complete, ...calledOff]
  };
}

function useServerUrl() {
  const [url, setUrlState] = useState(() => localStorage.getItem("bkk_server_url") || "");
  const setUrl = u => {
    const cleaned = u.trim().replace(/\/$/, "");
    localStorage.setItem("bkk_server_url", cleaned);
    setUrlState(cleaned);
  };
  return [url, setUrl];
}
function useServerState(serverUrl) {
  const [state, setState] = useState(null);
  const [connected, setConnected] = useState(null);
  const [error, setError] = useState(null);
  useEffect(() => {
    if (!serverUrl) return;
    let cancelled = false;
    const poll = async () => {
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 15000);
        const res = await fetch(`${serverUrl}/state`, {
          headers: {
            "ngrok-skip-browser-warning": "true"
          },
          signal: controller.signal
        });
        clearTimeout(timeout);
        const contentType = res.headers.get("content-type") || "";
        if (!contentType.includes("application/json")) {
          throw new Error(`Server returned ${res.status} but not JSON (got "${contentType}") — likely an ngrok interstitial or wrong URL/port`);
        }
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (cancelled) return;
        setState(data);
        setConnected(true);
        setError(null);
      } catch (e) {
        if (!cancelled) {
          setConnected(false);
